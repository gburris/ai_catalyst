name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: todos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/todos_test
      JWT_SECRET: a-long-test-secret-for-ci-at-least-32-chars
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Run migrations
        run: npm run migrate --workspace=server

      - name: Run backend tests with coverage
        run: npm run test:coverage --workspace=server

      - name: Run frontend tests with coverage
        run: npm run test:coverage --workspace=client

      - name: Build frontend
        run: npm run build --workspace=client

      - name: Lint
        run: npm run lint --workspaces
